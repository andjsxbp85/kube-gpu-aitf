apiVersion: v1
kind: Service
metadata:
  name: jupyter-headless
spec:
  clusterIP: None
  selector:
    app: jupyter
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jupyter
spec:
  serviceName: jupyter-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      nodeSelector:
        gpu: "true"
      containers:
        - name: jupyter
          image: 877231425909.dkr.ecr.us-east-1.amazonaws.com/aitf/jupyter-image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          env:
            - name: JUPYTER_TOKEN
              value: "superpassword"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              ephemeral-storage: "20Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "8Gi"
              ephemeral-storage: "40Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-0-public
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: jupyter-0
  ports:
    - name: http
      port: 80
      targetPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-1-public
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: jupyter-1
  ports:
    - name: http
      port: 80
      targetPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-2-public
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: jupyter-2
  ports:
    - name: http
      port: 80
      targetPort: 8888
